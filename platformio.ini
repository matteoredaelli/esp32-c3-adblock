[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c6]
; The official platformio "espressif32" platform doesn't ship an Arduino
; variant for the C6 yet (no "arduino" entry in its board manifest, no
; esp32c6 folder under framework-arduinoespressif32/variants). Use the
; community-maintained pioarduino fork instead, which tracks newer
; Espressif chips (C6/C5/H2/P4) with a current Arduino core (IDF 5.5.x).
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_build.partitions = partitions_c6_16mb.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
